#@TYPE: Machine
#@NAME: EMBEDIAN i.MX 93 SMARC Board with 2GB LPDDR4X
#@SOC: i.MX93
#@DESCRIPTION: Machine configuration for Embedian SMARC-iMX93 CPU Module
#@MAINTAINER: ERic Lee <eric.lee@nxp.com>

MACHINEOVERRIDES =. "mx93:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

KERNEL_DEVICETREE_BASENAME = "imx93-smarc"

PREFERRED_PROVIDER_virtual/kernel:use-nxp-bsp ??= "linux-imx"

KERNEL_DEVICETREE = " \
    embedian/${KERNEL_DEVICETREE_BASENAME}.dtb \
"

KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    embedian/${KERNEL_DEVICETREE_BASENAME}-1g.dtb \
"
PREFERRED_PROVIDER_u-boot:use-nxp-bsp = "u-boot-imx"
PREFERRED_PROVIDER_virtual/bootloader:use-nxp-bsp = "u-boot-imx"

LOADADDR = ""
UBOOT_SUFFIX = "bin"
UBOOT_MAKE_TARGET = ""

SPL_BINARY = "spl/u-boot-spl.bin"

UBOOT_CONFIG_BASENAME = "smarcimx93"
UBOOT_CONSOLE_BASENAME = "ser3"
LPDDR4_BASENAME = "2g"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "${UBOOT_CONFIG_BASENAME}_${LPDDR4_BASENAME}_${UBOOT_CONSOLE_BASENAME}_defconfig,sdcard"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

# Set u-boot DTB
UBOOT_DTB_NAME = "${KERNEL_DEVICETREE_BASENAME}.dtb"

# Set ATF platform name
ATF_PLATFORM = "imx93"

IMXBOOT_TARGETS = "flash_singleboot"

IMX_BOOT_SOC_TARGET = "iMX9"
IMX_BOOT_SEEK = "32"

# Set Serial console
SERIAL_CONSOLES = "115200;ttyLP0"

IMX_DEFAULT_BSP = "nxp"

MACHINE_FEATURES += "pci wifi bluetooth"
MACHINE_FEATURES:append:use-nxp-bsp = " usbgadget vfat ext2 alsa serial optee jailhouse dpdk nxpiw612-sdio"

MACHINE_FIRMWARE:append = " ethos-u-firmware"

WKS_FILE_DEPENDS:append = " imx-m33-demos"

IMAGE_FEATURES:append = "package-management"

IMAGE_BOOT_FILES:append = " \
    smarcimx93_m33_TCM_low_power_wakeword.bin \
    smarcimx93_m33_TCM_power_mode_switch.bin \
    smarcimx93_m33_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    smarcimx93_m33_TCM_rpmsg_lite_str_echo_rtos.bin \
    smarcimx93_m33_TCM_sai_low_power_audio.bin \
"

MACHINE_EXTRA_RRECOMMENDS += " \
        imx-boot \
        packagegroup-tools-bluetooth \
        pm-utils \
        kmod \
        hdparm \
        gptfdisk \
        lftp \
        vim \
        ntp \
        boost \
        nodejs \
        android-tools \
	v4l-utils \
	imx-gst1.0-plugin \
"

IMAGE_INSTALL:append = " \
	firmware-nxp-wifi-nxpiw612-sdio \
	nxp-wlan-sdk \
	kernel-module-nxp-wlan \
        ppp \
        usb-modeswitch-data \
        usb-modeswitch \
"

IMAGE_FSTYPES = "tar.bz2"


