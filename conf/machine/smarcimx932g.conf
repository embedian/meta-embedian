#@TYPE: Machine
#@NAME: EMBEDIAN i.MX 93 SMARC Module with 2GB LPDDR4X
#@SOC: i.MX93
#@DESCRIPTION: Machine configuration for EMBEDIAN i.MX 93 CPU Module with 2GB LPDDR4X
#@MAINTAINER: ERic Lee <eric.lee@nxp.com>

MACHINEOVERRIDES =. "mx93:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

PREFERRED_PROVIDER_virtual/kernel:use-nxp-bsp ??= "linux-imx"

KERNEL_DEVICETREE_BASENAME = "imx93-smarc"

KERNEL_DEVICETREE = " \
	embedian/${KERNEL_DEVICETREE_BASENAME}.dtb \
"

PREFERRED_PROVIDER_u-boot:use-nxp-bsp = "u-boot-imx"
PREFERRED_PROVIDER_virtual/bootloader:use-nxp-bsp = "u-boot-imx"

LOADADDR = ""
UBOOT_SUFFIX = "bin"
UBOOT_MAKE_TARGET = ""

SPL_BINARY = "spl/u-boot-spl.bin"

UBOOT_CONFIG_BASENAME = "smarcimx93"
UBOOT_CONSOLE_BASENAME = "ser3"
LPDDR4_BASENAME = "2g"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "${UBOOT_CONFIG_BASENAME}_${LPDDR4_BASENAME}_${UBOOT_CONSOLE_BASENAME}_defconfig,sdcard"

# Set ATF platform name
ATF_PLATFORM = "imx93"

IMX_BOOT_SOC_TARGET = "iMX9"
IMXBOOT_TARGETS = "flash_singleboot"
IMXBOOT_TARGETS_BASENAME = "flash_singleboot"
IMX_BOOT_SEEK = "32"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

# Set Serial console
SERIAL_CONSOLES = "115200;ttyLP0"

IMX_DEFAULT_BSP = "nxp"

MACHINE_FEATURES += "pci wifi bluetooth usbgadget vfat ext2 alsa serial dpdk nxpwifi-all-sdio package-management"
MACHINE_FEATURES:append:use-nxp-bsp = " optee jailhouse nxpiw612-sdio"
MACHINE_FIRMWARE:append = " ethos-u-firmware"
WKS_FILE_DEPENDS:append = " imx-m33-demos"

MACHINE_EXTRA_RRECOMMENDS += " \
	imx-boot \
	packagegroup-tools-bluetooth \
	pm-utils \
	kmod \
	hdparm \
	gptfdisk \
	lftp \
	vim \
	ntp \
	boost \
	nodejs \
	android-tools \
	v4l-utils \
	imx-gst1.0-plugin \
"

IMAGE_INSTALL:append = " \
	firmware-nxp-wifi-all-sdio \
	firmware-nxp-wifi-nxpiw612-sdio \
	nxp-wlan-sdk \
	kernel-module-nxp-wlan \
	ppp \
	usb-modeswitch-data \
	usb-modeswitch \
"

IMAGE_FSTYPES = "tar.bz2"
