#@TYPE: Machine
#@NAME: EMBEDIAN i.MX 8M Plus pITX SBC with 6GB LPDDR4
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for EMBEDIAN i.MX 8M Plus pITX SBC with 6GB LPDDR4
#@MAINTAINER: Eric Lee <eric.lee@embedian.com>

MACHINEOVERRIDES =. "mx8mp:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

# Mainline BSP defaults to "generic" cortexa53 configuration,
# adjust it here to include crypto extension which enables
# inline NEON and FPU code generation
DEFAULTTUNE:use-mainline-bsp = "cortexa53-crypto"

MACHINE_FEATURES += " pci wifi bluetooth usbgadget vfat ext2 alsa serial nxp8997-pcie nxp8997-pcie nxp8997-sdio nxp9098-pcie nxp9098-sdio nxpwifi-all-pcie nxpwifi-all-sdio dpdk package-management"

MACHINE_FEATURES:append:use-nxp-bsp = " jailhouse"

WKS_FILE_DEPENDS:append = " imx-m7-demos"
IMAGE_BOOT_FILES:append = " \
	mcore-demos/imx8mp_m7_TCM_hello_world.bin \
	mcore-demos/imx8mp_m7_TCM_low_power_wakeword.bin \
	mcore-demos/imx8mp_m7_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
	mcore-demos/imx8mp_m7_TCM_rpmsg_lite_str_echo_rtos.bin \
	mcore-demos/imx8mp_m7_TCM_sai_low_power_audio.bin \
"

PREFERRED_PROVIDER_virtual/kernel:use-nxp-bsp ??= "linux-imx"

# The device tree name is implicit for LPDDR4, so can't use MACHINE here
KERNEL_DEVICETREE_BASENAME = "imx8mp-pitx"

# NXP kernel has additional DTB files for various board configuration and
# derivates. Include them here for NXP BSP only
KERNEL_DEVICETREE = " \
	embedian/${KERNEL_DEVICETREE_BASENAME}.dtb \
"
KERNEL_DEVICETREE:append:use-nxp-bsp = " \
	embedian/${KERNEL_DEVICETREE_BASENAME}-lvds.dtb \
	embedian/${KERNEL_DEVICETREE_BASENAME}-rs485.dtb \
	embedian/${KERNEL_DEVICETREE_BASENAME}-lvds-rs485.dtb \
"

PREFERRED_PROVIDER_u-boot:use-nxp-bsp = "u-boot-imx"
PREFERRED_PROVIDER_virtual/bootloader:use-nxp-bsp = "u-boot-imx"

UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG_BASENAME = "pitximx8mp"
LPDDR4_BASENAME = "6g"
UBOOT_CONFIG[sd] = "${UBOOT_CONFIG_BASENAME}_${LPDDR4_BASENAME}_defconfig,sdcard"

# Set DDR FIRMWARE
DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"
SOC_ATF_BOOT_UART_BASE:mx8m-generic-bsp = "0x30a60000"
ATF_BOOT_UART_BASE			?= "${SOC_ATF_BOOT_UART_BASE}"

# Set u-boot DTB
UBOOT_DTB_NAME = "${KERNEL_DEVICETREE_BASENAME}.dtb"

UBOOT_SUFFIX = "bin"

IMXBOOT_TARGETS = "flash_evk"
IMXBOOT_TARGETS_BASENAME = "flash_evk"

IMX_BOOT_SOC_TARGET = "iMX8MP"

SPL_BINARY = "spl/u-boot-spl.bin"

ATF_PLATFORM = "imx8mp"

# Mainline BSP doesn't support LPDDR4 so it must be set to nxp.
# Also this machine isn't supported by u-boot-fslc but imx8mn-evk.inc already
# set the bootloader to u-boot-imx instead when NXP BSP is used.
IMX_DEFAULT_BSP = "nxp"

# Set Serial console
SERIAL_CONSOLES = "115200;ttymxc3"

LOADADDR = ""
UBOOT_MAKE_TARGET = "all"
IMX_BOOT_SEEK = "32"

OPTEE_BIN_EXT = "8mp"
TEE_LOAD_ADDR = "0x56000000"

# Add additional firmware
MACHINE_FIRMWARE:append = " linux-firmware-ath10k"

TEE_CFG_DDR_SIZE ?= "0x180000000"

IMAGE_INSTALL:append = " \
	imx-boot \
	packagegroup-tools-bluetooth \
	pm-utils \
	kmod \
	hdparm \
	gptfdisk \
	lftp \
	vim \
	ntp \
	boost \
	nodejs \
	android-tools \
	v4l-utils \
	imx-gst1.0-plugin \
"

IMAGE_INSTALL:append = " \
	firmware-imx-sdma-imx7d \
	firmware-imx-easrc-imx8mn \
	firmware-imx-xcvr-imx8mp \
	firmware-nxp-wifi-nxp8997-sdio \
	firmware-nxp-wifi-nxp8997-pcie \
	firmware-nxp-wifi-nxp9098-sdio \
	firmware-nxp-wifi-nxp9098-pcie \
	firmware-nxp-wifi-all-pcie \
	firmware-nxp-wifi-all-sdio \
	nxp-wlan-sdk \
	wpa-supplicant \
	iw \
	wireless-regdb \
	libnl \
	busybox \
	kernel-module-nxp-wlan \
	ppp \
	usb-modeswitch-data \
	usb-modeswitch \
	linuxptp \
	iproute2 \
	rfkill \
	ethtool \
	lldpd \
	tsntool \
	kernel-modules \
"

PACKAGECONFIG:append:pn-lldpd = " nl80211"

# Add package
IGH_ETHERCAT ??= " "
IGH_ETHERCAT:pitximx8mp6g = " fec "
PACKAGECONFIG:append:pn-igh-ethercat = " ${IGH_ETHERCAT} "
IMAGE_INSTALL += " igh-ethercat "

# Add package
REAL_TIME_EDGE_SYSREPO:pitximx8mp6g = ""
PACKAGECONFIG:append:pn-real-time-edge-sysrepo = "${REAL_TIME_EDGE_SYSREPO}"
IMAGE_INSTALL:append = " real-time-edge-sysrepo "

# Add package
# Select OPC UA example application
include ${BSPDIR}/sources/meta-real-time-edge/conf/distro/include/libopen62541.inc
LIBOPEN62541_LOGLEVE = "300"
IMAGE_INSTALL += " libopen62541 "

IMAGE_FSTYPES = "tar.bz2"
