#@TYPE: Machine
#@NAME: EMBEDIAN i.MX 8M Mini CPU Module with 4GB LPDDR4
#@SOC: i.MX8MM
#@DESCRIPTION: Machine configuration for Embedian SMARC-iMX8MM CPU Module with 4GB LPDDR4
#@MAINTAINER: Eric Lee <eric.lee@embedian.com>

MACHINEOVERRIDES =. "mx8mm:"

require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

# The device tree name is implicit for LPDDR4, so can't use MACHINE here
KERNEL_DEVICETREE_BASENAME = "imx8mm-smarc"

# Mainline BSP defaults to "generic" cortexa53 configuration,
# adjust it here to include crypto extension which enables
# inline NEON and FPU code generation
DEFAULTTUNE:use-mainline-bsp = "cortexa53-crypto"

MACHINE_FEATURES += "pci wifi bluetooth usbgadget vfat ext2 alsa serial dpdk nxpwifi-all-sdio nxpwifi-all-pcie nxp8987-pcie package-management"

# NXP BSP can consume proprietary jailhouse and BCM4359 firmware
# Since the firmware is not available publicly, and rather distributed
# under "Proprietary" license - we opt-out from using it in all BSPs
# and pin it to NXP BSP only
# OP-TEE is also applicable to NXP BSP, mainline BSP seems not to have
# a full support for it yet.
MACHINE_FEATURES:append:use-nxp-bsp = " jailhouse"

PREFERRED_PROVIDER_virtual/kernel:use-nxp-bsp ??= "linux-imx"

KERNEL_DEVICETREE = " \
    embedian/${KERNEL_DEVICETREE_BASENAME}.dtb \
"
KERNEL_DEVICETREE:append:use-nxp-bsp = " \
    embedian/${KERNEL_DEVICETREE_BASENAME}-m4.dtb \
"

PREFERRED_PROVIDER_u-boot:use-nxp-bsp = "u-boot-imx"
PREFERRED_PROVIDER_virtual/bootloader:use-nxp-bsp = "u-boot-imx"

UBOOT_DTB_NAME = "${KERNEL_DEVICETREE_BASENAME}.dtb"

UBOOT_SUFFIX = "bin"

UBOOT_CONFIG ??= "sd"

UBOOT_CONFIG_BASENAME = "smarcimx8mm"
UBOOT_CONSOLE_BASENAME = "ser3"
LPDDR4_BASENAME = "4g"
UBOOT_CONFIG[sd]       = "${UBOOT_CONFIG_BASENAME}_${LPDDR4_BASENAME}_${UBOOT_CONSOLE_BASENAME}_defconfig,sdcard"

SPL_BINARY = "spl/u-boot-spl.bin"

ATF_PLATFORM = "imx8mm"

IMXBOOT_TARGETS = "flash_evk"

IMX_BOOT_SOC_TARGET = "iMX8MM"

DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_imem.bin \
    lpddr4_pmu_train_1d_dmem.bin \
    lpddr4_pmu_train_2d_imem.bin \
    lpddr4_pmu_train_2d_dmem.bin \
"

SERIAL_CONSOLES = "115200;ttymxc1"

LOADADDR = ""
UBOOT_MAKE_TARGET = "all"
IMX_BOOT_SEEK = "33"

OPTEE_BIN_EXT = "8mm"
TEE_LOAD_ADDR = "0xbe000000"

# Add additional firmware
MACHINE_FIRMWARE:append = " linux-firmware-ath10k"

WKS_FILE_DEPENDS:append = " imx-m4-demos"

IMAGE_BOOT_FILES:append = " \
    mcore-demos/imx8mm_m4_TCM_hello_world.bin \
    mcore-demos/imx8mm_m4_TCM_low_power_wakeword.bin \
    mcore-demos/imx8mm_m4_TCM_rpmsg_lite_pingpong_rtos_linux_remote.bin \
    mcore-demos/imx8mm_m4_TCM_rpmsg_lite_str_echo_rtos.bin \
"
MACHINE_EXTRA_RRECOMMENDS += " \
        imx-boot \
        packagegroup-tools-bluetooth \
        pm-utils \
        kmod \
        hdparm \
        gptfdisk \
        lftp \
        vim \
        ntp \
        boost \
        nodejs \
        android-tools \
        v4l-utils \
        imx-gst1.0-plugin \
"
IMAGE_INSTALL:append = " \
        firmware-imx-sdma-imx7d \
        firmware-nxp-wifi-all-sdio \
	firmware-nxp-wifi-all-pcie \
        kernel-module-nxp-wlan \
        nxp-wlan-sdk \
        ppp \
        usb-modeswitch-data \
        usb-modeswitch \
"
IMAGE_FSTYPES = "tar.bz2"
